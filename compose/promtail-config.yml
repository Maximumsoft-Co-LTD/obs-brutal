server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: obs-brutal-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: obs-brutal
          app: obs-brutal
          env: dev
          __path__: /var/log/app/*.log

