name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: vet + unit + verification + guarantees + golden + freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: '0'
        run: go test -timeout 120s -count=1 -cover ./...

  integration:
    name: integration (mongo + redis + rabbitmq + chain)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go test -tags integration
        env:
          CGO_ENABLED: '0'
          MONGO_HOST: localhost:27017
          REDIS_ADDR: localhost:6379
          RABBIT_URL: amqp://guest:guest@localhost:5672/
        run: go test -tags integration -timeout 300s -count=1 ./...

  benchmark:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go test -bench
        env:
          CGO_ENABLED: '0'
        # benchtime kept tight so we just confirm benchmarks compile and
        # produce output on every commit; actual numbers live in a
        # tracked artifact, not in this gate.
        run: go test -bench . -benchtime 200ms -run ^$ -count=1 ./benchmarks/...
